version: '3'

silent: true

tasks:
  install:
    desc: Install canonical files into ~/.claude (additive; settings merged)
    cmds:
      - ./install.sh

  install:dry:
    desc: Show what install would do without making changes
    cmds:
      - ./install.sh --dry-run

  install:migrate:
    desc: One-time migration — remove ~/.claude/.git/.gitignore, then install
    cmds:
      - ./install.sh --migrate

  install:prune:
    desc: Remove files canonical no longer ships (manifest-driven)
    cmds:
      - ./install.sh --prune
